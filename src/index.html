<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Apply the saved theme before the stylesheet and Angular render.
      (() => {
        let mode = 'dark';
        try {
          if (localStorage.getItem('lokesh-theme') === 'light') mode = 'light';
        } catch {
          /* Storage may be unavailable in private or restricted contexts. */
        }
        document.documentElement.classList.toggle('dark', mode === 'dark');
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <title>@@SiteTitle@@</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="@@SiteDescription@@" />
    <meta property="og:title" content="@@SiteTitle@@" />
    <meta property="og:description" content="@@SiteSocialDescription@@" />
    <meta property="og:image" content="/assets/images/og-default.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/icons/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
