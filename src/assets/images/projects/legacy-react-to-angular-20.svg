<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="legacy-angular-title legacy-angular-desc">
  <title id="legacy-angular-title">Legacy React SPA to Angular 20 architecture story</title>
  <desc id="legacy-angular-desc">Seven-step architecture story showing legacy React SPA, architecture review, Angular 20 standalone app, typed content layer, accessible modal case studies, SEO and structured data, and S3 and CloudFront deployment.</desc>
  <style>
    .bg { fill: #020617; }
    .halo { fill: #84cc16; opacity: 0.08; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.4; }
    .panel-accent { fill: rgba(132, 204, 22, 0.08); stroke: #84cc16; stroke-width: 1.4; }
    .title { fill: #f8fafc; font: 700 52px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { fill: #a3e635; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 6px; }
    .subtitle { fill: #cbd5e1; font: 400 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .step-number { fill: #020617; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .step-title { fill: #f8fafc; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .step-copy { fill: #cbd5e1; font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .outcome-title { fill: #f8fafc; font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .outcome-copy { fill: #cbd5e1; font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .line { stroke: #84cc16; stroke-width: 2; stroke-dasharray: 5 8; fill: none; opacity: 0.84; }
    .icon { stroke: #a3e635; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon-muted { stroke: #cbd5e1; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #84cc16; }
    .node-ring { fill: #020617; stroke: #84cc16; stroke-width: 2; }
    .rule { stroke: #84cc16; stroke-width: 3; }
    .divider { stroke: #334155; stroke-width: 1; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .halo { opacity: 0.14; }
      .panel { fill: #ffffff; stroke: #cbd5e1; }
      .panel-accent { fill: #f7fee7; stroke: #65a30d; }
      .title, .step-title, .outcome-title { fill: #0f172a; }
      .eyebrow { fill: #4d7c0f; }
      .subtitle, .step-copy, .outcome-copy { fill: #475569; }
      .line, .rule { stroke: #65a30d; }
      .icon { stroke: #65a30d; }
      .icon-muted { stroke: #475569; }
      .node { fill: #65a30d; }
      .node-ring { fill: #ffffff; stroke: #65a30d; }
      .step-number { fill: #ffffff; }
      .divider { stroke: #cbd5e1; }
    }
  </style>
  <defs>
