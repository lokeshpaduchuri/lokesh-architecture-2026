      <text class="step-number" x="36" y="32">7</text>
      <rect class="panel" x="0" y="86" width="176" height="342" rx="14" filter="url(#soft-shadow)" />
      <text class="step-title" x="18" y="128">S3 AND</text>
      <text class="step-title" x="18" y="151">CLOUDFRONT</text>
      <g transform="translate(30 190)">
        <text x="0" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="700">aws</text>
        <path d="M6 52c30 22 82 18 104-4" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" />
