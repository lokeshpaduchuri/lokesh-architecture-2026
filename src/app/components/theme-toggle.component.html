<button
  class="inline-flex h-11 w-11 items-center justify-center rounded-md text-slate-600 transition hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-accent dark:text-slate-300 dark:hover:bg-slate-800"
  type="button"
  [attr.aria-label]="toggleLabel"
  [attr.title]="toggleLabel"
  (click)="theme.toggleTheme()"
>
  <span aria-hidden="true" class="text-2xl leading-none">{{ themeIcon }}</span>
</button>
