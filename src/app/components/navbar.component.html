<header
  class="no-print sticky top-0 z-30 border-b border-slate-200 bg-slate-50 dark:border-slate-800 dark:bg-slate-950"
>
  <nav [attr.aria-label]="text.MainNavigation" class="relative mx-auto max-w-6xl px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <a
        routerLink="/"
        (click)="closeMenu()"
        class="flex min-h-11 items-center text-sm font-semibold sm:text-base"
        >{{ text.Name }}</a
      >

      <div class="hidden items-center gap-1 text-sm md:flex">
        <a
          class="nav-link"
          routerLink="/work"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          >{{ text.Work }}</a
        >
        <a
          class="nav-link"
          routerLink="/resume"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          >{{ text.Resume }}</a
        >
        <a
          class="nav-link"
          routerLink="/about"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          >{{ text.About }}</a
        >
        <a
          class="nav-link ml-2 border border-slate-300 dark:border-slate-700"
          routerLink="/contact"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          >{{ text.Contact }}</a
        >
        <app-theme-toggle />
      </div>

      <div class="flex items-center gap-2 md:hidden">
        <app-theme-toggle />
        <button
          #menuToggle
          type="button"
          class="inline-flex min-h-11 items-center rounded-md border border-slate-300 px-3 py-2 text-sm font-medium transition hover:border-accent focus:outline-none focus-visible:ring-2 focus-visible:ring-accent md:hidden dark:border-slate-700"
          [attr.aria-expanded]="menuOpen"
          aria-controls="mobile-menu"
          [attr.aria-label]="menuOpen ? text.CloseMenu : text.OpenMenu"
          (click)="toggleMenu()"
        >
          {{ menuOpen ? text.Close : text.Menu }}
        </button>
      </div>
    </div>

    <button
      type="button"
      class="mobile-menu-backdrop fixed inset-0 top-[69px] z-30 bg-black/40 md:hidden"
      [attr.aria-label]="text.CloseMenu"
      *ngIf="menuOpen"
      (click)="closeMenu(true)"
    ></button>

    <div
      #mobileMenu
      id="mobile-menu"
      class="mobile-menu-panel absolute left-4 right-4 top-[calc(100%+0.5rem)] z-40 rounded-lg border border-slate-200 bg-white p-2 shadow-xl shadow-slate-950/10 md:hidden dark:border-slate-800 dark:bg-slate-900 dark:shadow-black/30"
      *ngIf="menuOpen"
    >
      <a
        routerLink="/work"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMenu()"
        >{{ text.Work }}</a
      >
      <a
        routerLink="/resume"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMenu()"
        >{{ text.Resume }}</a
      >
      <a
        routerLink="/about"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMenu()"
        >{{ text.About }}</a
      >
      <a
        routerLink="/contact"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMenu()"
        >{{ text.Contact }}</a
      >
    </div>
  </nav>
</header>
