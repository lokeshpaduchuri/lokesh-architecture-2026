<header
  class="no-print sticky top-0 z-30 border-b border-slate-200/80 bg-slate-50/95 backdrop-blur dark:border-slate-800 dark:bg-slate-950/95"
>
  <nav class="mx-auto max-w-6xl px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <a routerLink="/" (click)="closeMenu()" class="text-sm font-semibold tracking-wide sm:text-base"
        >Lokesh Paduchuri</a
      >

      <div class="hidden items-center gap-4 text-sm md:flex">
        <a routerLink="/work" routerLinkActive="font-semibold text-accent">Work</a>
        <a routerLink="/resume" routerLinkActive="font-semibold text-accent">Resume</a>
        <a routerLink="/about" routerLinkActive="font-semibold text-accent">About</a>
        <a routerLink="/contact" routerLinkActive="font-semibold text-accent">Contact</a>
        <app-theme-toggle />
      </div>

      <button
        type="button"
        class="inline-flex items-center rounded-md border border-slate-300 px-2.5 py-1.5 text-sm md:hidden dark:border-slate-700"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-menu"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        ☰
      </button>
    </div>

    <div id="mobile-menu" class="mt-3 space-y-2 border-t border-slate-200 pt-3 md:hidden dark:border-slate-800" *ngIf="menuOpen">
      <a routerLink="/work" routerLinkActive="font-semibold text-accent" class="block py-1.5" (click)="closeMenu()">Work</a>
      <a routerLink="/resume" routerLinkActive="font-semibold text-accent" class="block py-1.5" (click)="closeMenu()">Resume</a>
      <a routerLink="/about" routerLinkActive="font-semibold text-accent" class="block py-1.5" (click)="closeMenu()">About</a>
      <a routerLink="/contact" routerLinkActive="font-semibold text-accent" class="block py-1.5" (click)="closeMenu()">Contact</a>
      <app-theme-toggle />
    </div>
  </nav>
</header>
