<article
  class="group relative flex h-full flex-col rounded-lg border border-slate-200 bg-white p-5 transition duration-200 hover:-translate-y-[3px] hover:border-accent/60 hover:shadow-md focus-within:ring-2 focus-within:ring-accent focus-within:ring-offset-2 focus-within:ring-offset-slate-50 sm:p-6 dark:border-slate-800 dark:bg-slate-900 dark:focus-within:ring-offset-slate-950"
>
  <p class="eyebrow mb-3">{{ project.category }}</p>
  <h3
    [id]="'case-study-title-' + project.slug"
    class="text-[22px] font-semibold leading-snug text-slate-950 dark:text-slate-50"
  >
    {{ project.title }}
  </h3>
  <p class="mt-3 flex-1 text-sm leading-6 text-slate-600 dark:text-slate-300">
    {{ project.summary }}
  </p>
  <p
    class="mt-5 border-l-2 border-accent/50 pl-3 text-sm font-medium leading-6 text-slate-700 dark:text-slate-200"
  >
    {{ project.measurableImpact || project.outcomes[0] }}
  </p>
  <ul class="mt-4 flex flex-wrap gap-2">
    <li
      class="text-xs text-slate-600 dark:text-slate-400"
      *ngFor="let item of project.technologies | slice: 0 : 3"
    >
      {{ item }}
    </li>
  </ul>
  <p class="mt-5 text-xs text-slate-500 dark:text-slate-400">
    {{ project.visibilityLabel
    }}<ng-container *ngIf="project.yearLabel"
      >{{ text.Separator }}{{ project.yearLabel }}</ng-container
    >
  </p>
  <button
    type="button"
    class="mt-3 inline-flex min-h-11 items-center gap-2 text-left text-sm font-semibold text-slate-900 transition after:absolute after:inset-0 after:cursor-pointer after:rounded-lg after:content-[''] group-hover:text-accent focus:outline-none focus-visible:underline dark:text-slate-100"
    [attr.aria-labelledby]="
      'case-study-action-' + project.slug + ' case-study-title-' + project.slug
    "
    (click)="open.emit(project)"
  >
    <span [id]="'case-study-action-' + project.slug">{{ text.ViewCaseStudy }}</span>
    <span aria-hidden="true" class="transition group-hover:translate-x-1">{{
      text.ArrowRight
    }}</span>
  </button>
</article>
