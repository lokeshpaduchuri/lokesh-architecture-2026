<article
  class="group flex h-full cursor-pointer flex-col rounded-lg border border-slate-200 bg-white p-4 shadow-sm transition duration-200 hover:-translate-y-1 hover:border-accent/60 hover:shadow-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-slate-50 sm:p-5 dark:border-slate-800 dark:bg-slate-900 dark:focus-visible:ring-offset-slate-950"
  role="button"
  tabindex="0"
  (click)="open.emit(project)"
  (keydown)="openFromKeyboard($event)"
>
  <p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-accent">{{ metadataParts.join(' · ') }}</p>
  <h3 class="text-[clamp(1.375rem,6vw,1.625rem)] font-semibold leading-tight text-slate-950 sm:text-lg dark:text-slate-50">{{ project.title }}</h3>
  <p class="mt-3 flex-1 text-sm leading-6 text-slate-600 dark:text-slate-300">{{ project.summary }}</p>
  <p *ngIf="project.measurableImpact" class="mt-4 inline-flex w-fit rounded-full bg-lime-100 px-2.5 py-1 text-xs font-semibold text-lime-900 dark:bg-lime-950 dark:text-lime-200">
    {{ project.measurableImpact }}
  </p>
  <ul class="mt-4 flex flex-wrap gap-2">
    <li class="rounded-full bg-slate-100 px-2 py-1 text-xs text-slate-700 dark:bg-slate-800 dark:text-slate-300" *ngFor="let item of project.technologies | slice:0:3">
      {{ item }}
    </li>
  </ul>
  <span class="mt-5 inline-flex items-center gap-2 text-sm font-semibold text-slate-900 transition group-hover:text-accent dark:text-slate-100">
    View case study
    <span aria-hidden="true" class="transition group-hover:translate-x-1">→</span>
  </span>
</article>
