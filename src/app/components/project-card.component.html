    <article class="group cursor-pointer rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-lg dark:border-slate-800 dark:bg-slate-900" (click)="open.emit(project)">
      <p class="mb-2 text-xs text-slate-500">{{ project.year }} · {{ project.domain }}</p>
      <h3 class="text-lg font-semibold">{{ project.title }}</h3>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">{{ project.summary }}</p>
      <ul class="mt-4 flex flex-wrap gap-2">
        <li class="rounded-full bg-slate-100 px-2 py-1 text-xs dark:bg-slate-800" *ngFor="let item of project.tech | slice:0:3">{{ item }}</li>
      </ul>
    </article>
