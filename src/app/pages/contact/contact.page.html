    <section class="max-w-2xl py-10">
      <h1 class="text-3xl font-semibold">Contact</h1>
      <p class="mt-3 text-slate-600 dark:text-slate-300">Open to architecture leadership roles, consulting conversations, and strategic frontend advisory.</p>

      <ul class="mt-6 space-y-2">
        <li *ngFor="let link of links"><a [href]="link.url" class="text-accent underline">{{ link.label }}</a></li>
      </ul>

      <form class="mt-8 space-y-3 rounded-2xl border border-slate-200 p-4 dark:border-slate-800" (submit)="$event.preventDefault()">
        <label class="block text-sm">Name<input class="mt-1 w-full rounded border bg-transparent px-3 py-2" type="text" /></label>
        <label class="block text-sm">Message<textarea class="mt-1 w-full rounded border bg-transparent px-3 py-2" rows="4"></textarea></label>
        <button class="rounded bg-accent px-4 py-2 text-sm font-medium text-white" type="submit">Send (demo)</button>
      </form>
    </section>
